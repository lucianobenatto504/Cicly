<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cicly — cadastro</title>
<link rel="stylesheet" href="css/app.css">
<style>
.prototype{aspect-ratio:268/475;background-image:url('assets/tela-03.png')}

.prototype .field{
  color:#d81358;
  font-size:clamp(11px,4vw,16px);
  font-weight:500;
  line-height:1;
  padding:0 2px;
  background:transparent;
  caret-color:#d81358;
}
.prototype .field:focus{
  background:transparent;
  border-radius:0;
  box-shadow:none;
}
</style>
</head>
<body>
<main class="prototype" aria-label="Cicly — cadastro">

<form id="cadastro">
<input class="field" name="usuario" aria-label="Nome de usuário" style="left:3.8%;top:5.1%;width:75%;height:3.8%">
<input class="field" name="nascimento" aria-label="Data de nascimento" style="left:3.8%;top:18.8%;width:74%;height:3.8%">
<input class="field" name="email" type="email" aria-label="E-mail" style="left:3.8%;top:32.8%;width:76%;height:3.8%">
<input class="field" name="senha" type="password" aria-label="Senha" style="left:3.8%;top:46.8%;width:76%;height:3.8%">
<input class="field" name="confirmar" type="password" aria-label="Confirmar senha" style="left:3.8%;top:60.8%;width:76%;height:3.8%">
<button class="hotspot" type="submit" style="left:12.3%;top:90.1%;width:75%;height:8%" aria-label="Confirmar cadastro"></button>
</form>

</main>
<script src="js/app.js"></script>
<script>
document.getElementById('cadastro').addEventListener('submit',e=>{
 e.preventDefault();
 const d=Object.fromEntries(new FormData(e.target));
 if(d.senha!==d.confirmar){alert('As senhas não são iguais.');return;}
 save('ciclyCadastro',d);go(4);
});
</script>
</body>
</html>
