<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cicly — Cadastro</title>
  <style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{background:#ffd7e6;font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
.register-screen{
  width:min(100vw,430px);
  min-height:100vh;
  margin:0 auto;
  background:#ffd7e6;
  overflow:hidden;
  position:relative;
}
.register-form{
  width:100%;
  min-height:100vh;
  padding:8px 7px 12px;
  display:flex;
  flex-direction:column;
}
.register-form label{
  display:block;
  margin:0 0 24px;
}
.register-form label span{
  display:block;
  color:#f31a67;
  font-size:clamp(16px,6.7vw,28px);
  line-height:1.05;
  margin:0 0 2px 3px;
  font-weight:400;
}
.register-form input{
  display:block;
  width:78.5%;
  height:13px;
  padding:0 7px;
  border:0;
  border-radius:999px;
  outline:none;
  background:#f31a67;
  color:#fff;
  caret-color:#fff;
}
.register-form input:focus{
  box-shadow:0 0 0 3px rgba(243,26,103,.18);
}
.avatar-button{
  width:80px;
  height:80px;
  margin: -3px 0 0 3px;
  border:0;
  border-radius:50%;
  background:#2d559d;
  position:relative;
  padding:0;
}
.avatar-head{
  position:absolute;
  width:25px;
  height:25px;
  left:27px;
  top:10px;
  border-radius:50%;
  background:#9eb4df;
}
.avatar-body{
  position:absolute;
  width:51px;
  height:34px;
  left:14px;
  bottom:8px;
  border-radius:50% 50% 42% 42% / 62% 62% 38% 38%;
  background:#9eb4df;
}
.confirm-button{
  width:200px;
  min-height:37px;
  margin:auto auto 0;
  border:3px double #fff;
  outline:2px solid #f31a67;
  background:#f31a67;
  color:#fff;
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
  font-weight:700;
  padding:5px 10px 7px;
  line-height:1;
}
.confirm-button:active{transform:translateY(1px)}
@media (max-height:620px){
  .register-form label{margin-bottom:16px}
  .avatar-button{width:72px;height:72px}
}

</style>
</head>
<body>
  <main class="register-screen">
    <form class="register-form" id="registerForm" autocomplete="off">
      <label>
        <span>nome de usuário</span>
        <input name="usuario" type="text" required>
      </label>

      <label>
        <span>data de nascimento</span>
        <input name="nascimento" type="text" inputmode="numeric" required>
      </label>

      <label>
        <span>e-mail</span>
        <input name="email" type="email" required>
      </label>

      <label>
        <span>senha</span>
        <input name="senha" type="password" required>
      </label>

      <label>
        <span>confirmar senha</span>
        <input name="confirmarSenha" type="password" required>
      </label>

      <button class="avatar-button" type="button" aria-label="Adicionar foto de perfil">
        <span class="avatar-head"></span>
        <span class="avatar-body"></span>
      </button>

      <button class="confirm-button" type="submit">confirmar cadastro</button>
    </form>
  </main>

  <script>
const form = document.getElementById("registerForm");

form.addEventListener("submit", (event) => {
  event.preventDefault();

  const values = Object.fromEntries(new FormData(form));

  if (values.senha !== values.confirmarSenha) {
    alert("As senhas não são iguais.");
    return;
  }

  localStorage.setItem("ciclyCadastro", JSON.stringify(values));
  window.location.href = "tela-04.html";
});

</script>
</body>
</html>
