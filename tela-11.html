<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cicly — Sintomas</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%}
body{background:#ffd7e6;font-family:Arial,Helvetica,sans-serif}
button{font:inherit}
.screen{width:min(100vw,430px);min-height:100vh;margin:auto;background:#ffd7e6;padding:58px 10px 20px}
.intro,.subtitle{text-align:center;color:#ed1662;font-size:12px;line-height:1.25}
h1{text-align:center;color:#ed1662;font:700 clamp(25px,8.5vw,37px)/1 Georgia,"Times New Roman",serif;margin:29px 0 25px}
.subtitle{font-size:14px;margin-bottom:27px}
.symptoms{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px}
.symptoms button{border:0;background:transparent;color:#ed1662;padding:0;font-size:10px}
.icon{width:51px;height:51px;margin:0 auto 8px;border-radius:50%;background:rgba(255,255,255,.67);display:grid;place-items:center;color:#ed1662;font-weight:700;font-size:28px}
.symptoms button.selected .icon{box-shadow:0 0 0 3px #ed1662}
.symptoms b{font-weight:400;white-space:nowrap}
.battery{position:relative;font-size:0}.battery:before{content:"";width:30px;height:18px;border:3px solid #ed1662;border-radius:4px}.battery:after{content:"";position:absolute;right:7px;width:4px;height:9px;background:#ed1662;border-radius:0 2px 2px 0}.battery i{position:absolute;left:15px;width:3px;height:10px;background:#ed1662;box-shadow:5px 0 #ed1662,10px 0 #ed1662}
.none{border:2px solid #ed1662;font-size:36px;font-weight:300}.bolt{font-size:44px}.balloon{font-size:27px}.breast{font-size:42px;transform:rotate(90deg)}

</style></head>
<body><main class="screen">
<p class="intro">O ciclo menstrual pode afetar a forma como<br>você se sente.</p>
<h1>Como vc se sente?</h1>
<p class="subtitle">Selecione seus sintomas</p>

<section class="symptoms">
<button data-name="Fadiga"><span class="icon battery"><i></i></span><b>Fadiga</b></button>
<button data-name="Dor nas costas"><span class="icon back">♙</span><b>Dor nas costas</b></button>
<button data-name="Seios sensíveis"><span class="icon breast">◡</span><b>seios sensíveis</b></button>
<button data-name="Inchaço"><span class="icon balloon">●</span><b>Inchaço</b></button>
<button data-name="Cólicas"><span class="icon bolt">ϟ</span><b>Cólicas</b></button>
<button data-name="Nenhum"><span class="icon none">×</span><b>Nenhum</b></button>
</section>
</main><script>
document.querySelectorAll(".symptoms button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".symptoms button").forEach(x=>x.classList.remove("selected"));
    btn.classList.add("selected");
    localStorage.setItem("ciclySintoma",btn.dataset.name);
  });
});

</script></body></html>
