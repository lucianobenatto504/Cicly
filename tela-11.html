<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cicly — sintomas</title>
<link rel="stylesheet" href="css/app.css">
<style>
.prototype{aspect-ratio:269/479;background-image:url('assets/tela-11.png')}
</style>
</head>
<body>
<main class="prototype" aria-label="Cicly — sintomas">
<button class="hotspot symptom" data-name="Fadiga" style="left:8%;top:44%;width:24%;height:17%" aria-label="Fadiga"></button>
<button class="hotspot symptom" data-name="Dor nas costas" style="left:36%;top:44%;width:24%;height:17%" aria-label="Dor nas costas"></button>
<button class="hotspot symptom" data-name="Seios sensíveis" style="left:68%;top:44%;width:24%;height:17%" aria-label="Seios sensíveis"></button>
<button class="hotspot symptom" data-name="Inchaço" style="left:8%;top:64%;width:24%;height:17%" aria-label="Inchaço"></button>
<button class="hotspot symptom" data-name="Cólicas" style="left:36%;top:64%;width:24%;height:17%" aria-label="Cólicas"></button>
<button class="hotspot symptom" data-name="Nenhum" style="left:68%;top:64%;width:24%;height:17%" aria-label="Nenhum"></button>

<button id="continueArea11" class="hotspot" style="left:0;top:83%;width:100%;height:17%" aria-label="Continuar"></button>
</main>
<script src="js/app.js">
document.getElementById('continueArea11').onclick=()=>go(12);
</script>
<script>
const botoesSintomas = [...document.querySelectorAll('.symptom')];

function salvarSintomas(){
  const selecionados = botoesSintomas
    .filter(btn => btn.classList.contains('selected'))
    .map(btn => btn.dataset.name);

  save('sintomas', selecionados);
}

botoesSintomas.forEach(btn => {
  btn.onclick = () => {
    const nome = btn.dataset.name;

    if (nome === 'Nenhum') {
      const vaiSelecionar = !btn.classList.contains('selected');
      botoesSintomas.forEach(x => x.classList.remove('selected'));

      if (vaiSelecionar) {
        btn.classList.add('selected');
      }
    } else {
      const nenhum = botoesSintomas.find(x => x.dataset.name === 'Nenhum');
      nenhum?.classList.remove('selected');
      btn.classList.toggle('selected');
    }

    salvarSintomas();
  };
});
</script>
</body>
</html>
