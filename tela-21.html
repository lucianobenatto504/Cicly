<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cicly — questionário de gestação</title>
<link rel="stylesheet" href="css/app.css">
<style>
.prototype{aspect-ratio:268/479;background-image:url('assets/tela-21.png')}
</style>
</head>
<body>
<main class="prototype" aria-label="Cicly — questionário de gestação">

<form id="gestForm">
<input class="field" name="sexo" placeholder="Sexo do bebê" style="left:5%;top:18%;width:43%;height:5%">
<textarea class="field" name="alimentacao" placeholder="Alimentação" style="left:5%;top:28%;width:55%;height:7%;resize:none"></textarea>
<textarea class="field" name="atividade" placeholder="Atividade física" style="left:5%;top:38%;width:65%;height:8%;resize:none"></textarea>
<input class="field" name="semanas" type="number" min="1" max="42" placeholder="Semanas" style="left:5%;top:49%;width:68%;height:8%">
<textarea class="field" name="terapia" placeholder="Acompanhamento psicológico" style="left:5%;top:62%;width:78%;height:10%;resize:none"></textarea>
<button type="submit" class="hotspot" style="left:0;top:74%;width:100%;height:26%" aria-label="Continuar"></button>
</form>

</main>
<script src="js/app.js"></script>
<script>
document.getElementById('gestForm').onsubmit=e=>{
 e.preventDefault();
 save('questionarioGestacao',Object.fromEntries(new FormData(e.target)));
 go(22);
};
</script>
</body>
</html>
