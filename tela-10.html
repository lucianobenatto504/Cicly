<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cicly — duração do ciclo</title>
<link rel="stylesheet" href="css/app.css">
<style>
.prototype{aspect-ratio:268/477;background-image:url('assets/tela-10.png')}
</style>
</head>
<body>
<main class="prototype" aria-label="Cicly — duração do ciclo">

<button class="hotspot" id="menos" style="left:8%;top:12.5%;width:18%;height:12%" aria-label="Diminuir"></button>
<div class="counter-number" id="numero" style="left:39%;top:14.2%;width:20%;height:8%">1</div>
<button class="hotspot" id="mais" style="left:63%;top:12.5%;width:18%;height:12%" aria-label="Aumentar"></button>
<button class="hotspot" id="confirmar" style="left:20.8%;top:35.5%;width:58%;height:8.8%" aria-label="Sim, tenho"></button>
<button class="hotspot" id="naosei" style="left:20.8%;top:47%;width:58%;height:8.8%" aria-label="Não tenho"></button>

</main>
<script src="js/app.js"></script>
<script>
let valor=1;
function render(){numero.textContent=valor}
mais.onclick=()=>{valor++;render()};
menos.onclick=()=>{if(valor>1)valor--;render()};
confirmar.onclick=()=>{save('duracaoCiclo',valor);go(11)};
naosei.onclick=()=>save('duracaoCiclo','nao-sei');
</script>
</body>
</html>
