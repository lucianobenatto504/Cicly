<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cicly — acompanhamento da gestação</title>
<link rel="stylesheet" href="css/app.css">
<style>
.prototype{aspect-ratio:276/496;background-image:url('assets/tela-24.png')}
</style>
</head>
<body>
<main class="prototype" aria-label="Cicly — acompanhamento da gestação">

<button class="hotspot" id="settings" style="left:88%;top:0;width:12%;height:9%" aria-label="Configurações"></button>
<button class="hotspot" id="editGest" style="left:28%;top:50%;width:44%;height:7%" aria-label="Editar gestação"></button>
<button class="hotspot" id="ciclyDois" style="left:49%;top:89%;width:31%;height:7%" aria-label="Cicly a dois"></button>
<button class="hotspot" id="closeCard" style="left:14%;top:78%;width:8%;height:7%" aria-label="Fechar card"></button>

</main>
<script src="js/app.js"></script>
<script>
settings.onclick=()=>go(15);
editGest.onclick=()=>{const s=prompt('Quantas semanas?','30');if(s){save('semanasGestacao',Number(s));alert('Gestação atualizada.')}};
ciclyDois.onclick=()=>go(25);
closeCard.onclick=()=>{ciclyDois.style.display='none';closeCard.style.display='none';};
</script>
</body>
</html>
